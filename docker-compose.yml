# Full Gatherly stack: MongoDB + API + web app.
#
#   export OPENAI_API_KEY=sk-...  ADMIN_TOKEN=$(openssl rand -hex 24)
#   docker compose up --build
#
# Web: http://localhost:3000   API: http://localhost:8001/api/health
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: gatherly
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      LOG_LEVEL: INFO
    volumes:
      - checkpoints:/var/lib/gatherly
    ports:
      - "8001:8001"

  web:
    build:
      context: frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_API_URL:-http://localhost:8001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mongo-data:
  checkpoints:
